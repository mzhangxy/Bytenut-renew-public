name: Bytenut 续期 (DP版)

on:
  schedule:
    - cron: '12 */3 * * *' 
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run_renewal:
    name: 运行续期脚本
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下载私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Bytenut-renew
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          
      - name: 📂 移动脚本到工作目录
        run: mv private/main.py main.py

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: 安装依赖项
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage requests

      # 3. Xray 代理搭建
      - name: Setup Xray Proxy
        run: |
          # 下载最新 Xray 核心
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip
          chmod +x xray
          
          # 写入配置
          cat << 'EOF' > config.json
          ${{ secrets.XRAY_CONFIG_JSON }}
          EOF
          
          if [ ! -s config.json ]; then
            echo "❌ Error: XRAY_CONFIG_JSON is empty!"
            exit 1
          fi
          
          # 启动 Xray (监听 10808)
          ./xray -c config.json > xray_log.txt 2>&1 &
          echo "Xray 代理已在后台启动 (SOCKS5 Port: 10808)"
          
          sleep 12
          
          if ps aux | grep -v grep | grep -q "./xray"; then
            echo "✅ Xray 进程运行中"
            tail -n 20 xray_log.txt
          else
            echo "❌ Xray 启动失败"
            cat xray_log.txt
            exit 1
          fi

      - name: 运行续期脚本
        env:
          BYTENUT: ${{ secrets.BYTENUT }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY: "127.0.0.1:10808"
          GITHUB_ACTIONS: "true"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" python main.py

      - name: 清理历史
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
